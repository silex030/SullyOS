<body>
  <main>
    <h1>Android 框架占位页</h1>
    <p>这只是 Capacitor 生成 Android 工程时使用的框架占位页，<strong>不是</strong>当前 SullyOS 网页业务产物。</p>
    <p>真实网页构建输出在未来位于主仓库 <code>dist/</code>（相对本包 <code>../../dist</code>），通过“网页构建 → cap sync”进入原生工程。</p>
    <p>在未执行同步前，不得宣称网页已完整加载到该原生工程中。</p>
  </main>
</body>
